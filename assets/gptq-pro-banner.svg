<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">GPTQ-Pro — Ampere-native INT4 quantization on dual RTX 3090 NVLink workstation</title>
  <desc id="desc">A cinematic sci-fi banner with GPTQ-Pro branding and a realistic high-end gaming workstation showing two RTX 3090 GPUs connected by NVLink.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040b"/>
      <stop offset=".48" stop-color="#050916"/>
      <stop offset="1" stop-color="#07142c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".50" stop-color="#e9eaff"/>
      <stop offset=".72" stop-color="#9b63ff"/>
      <stop offset="1" stop-color="#21b8ff"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b64dff"/>
      <stop offset=".48" stop-color="#6c5cff"/>
      <stop offset="1" stop-color="#15c8ff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#434957"/>
      <stop offset=".16" stop-color="#171b24"/>
      <stop offset=".58" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#2a303b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29476d" stop-opacity=".32"/>
      <stop offset=".35" stop-color="#101c35" stop-opacity=".12"/>
      <stop offset="1" stop-color="#07101f" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="glowR" cx=".72" cy=".48" r=".55">
      <stop offset="0" stop-color="#4c4dff" stop-opacity=".38"/>
      <stop offset=".48" stop-color="#1a58ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset=".52" stop-color="#101424"/>
      <stop offset=".67" stop-color="#a04dff"/>
      <stop offset=".83" stop-color="#21b8ff"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7a79ff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5h10M5 0v10" stroke="#7385a5" stroke-opacity=".15" stroke-width=".6"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow10"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".75"/></filter>
    <clipPath id="round"><rect x="8" y="8" width="1584" height="504" rx="30"/></clipPath>
    <clipPath id="caseGlass"><path d="M1190 78h245l55 31v309l-55 29h-245z"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="8" y="8" width="1584" height="504" rx="30" fill="url(#bg)"/>
    <rect x="8" y="8" width="1584" height="504" rx="30" fill="url(#grid)"/>
    <rect x="8" y="8" width="1584" height="504" rx="30" fill="url(#glowR)"/>

    <!-- planetary / orbital atmosphere -->
    <path d="M0 83c97-71 195-84 313-44 38 13 72 34 101 62" fill="none" stroke="#3d79ff" stroke-opacity=".24" stroke-width="3"/>
    <path d="M1150 7c184 77 307 205 371 386" fill="none" stroke="#5f52ff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M1110 510c182-110 322-245 416-405" fill="none" stroke="#20baff" stroke-opacity=".13" stroke-width="2"/>
    <circle cx="1305" cy="264" r="205" fill="none" stroke="#3046a6" stroke-opacity=".26" stroke-width="2"/>
    <circle cx="1305" cy="264" r="177" fill="none" stroke="#7857ff" stroke-opacity=".17" stroke-width="1"/>
    <circle cx="1305" cy="264" r="150" fill="none" stroke="#22c2ff" stroke-opacity=".12" stroke-width="1"/>
    <g opacity=".72">
      <circle cx="1096" cy="54" r="1.7" fill="#4bc7ff"/><circle cx="1030" cy="121" r="2.2" fill="#905cff"/><circle cx="1530" cy="87" r="1.4" fill="#fff"/><circle cx="1462" cy="177" r="1.2" fill="#7d6bff"/><circle cx="1008" cy="390" r="1.6" fill="#fff"/><circle cx="1554" cy="377" r="2" fill="#35c7ff"/>
    </g>

    <!-- left branding -->
    <g transform="translate(80 60)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <path d="M22 0h232l18 10v22l-18 10H22L4 32V10Z" fill="#07101f" stroke="#23bfff" stroke-opacity=".78"/>
        <circle cx="25" cy="21" r="6" fill="#24ce8a" filter="url(#glow)"/>
        <text x="43" y="27" fill="#dff7ff" font-size="15" font-weight="800" letter-spacing="2.2">AMPERE-FIRST RUNTIME</text>
      </g>

      <text x="0" y="154" fill="url(#titleGrad)" font-size="106" font-weight="900" letter-spacing="-4">GPTQ-PRO</text>
      <text x="4" y="198" fill="#d7daf2" font-size="25" font-weight="500" letter-spacing="1.1">Symmetric <tspan fill="#25caff">INT4</tspan> quantization and native-qweight <tspan fill="#9a6cff">CUDA</tspan> inference</text>
      <text x="4" y="236" fill="#8a93b6" font-size="18" font-weight="500">Focused kernels. Guarded recipes. Measurable quality.</text>

      <g transform="translate(0 280)" font-size="12">
        <g>
          <path d="M8 0h214l10 10v38l-10 10H8L0 50V8Z" fill="#090f22" stroke="#735cff" stroke-opacity=".62"/>
          <rect x="16" y="13" width="32" height="32" rx="8" fill="#1b1234" stroke="#8d5cff"/>
          <path d="M24 21h16v16H24zm4-4v4m8-4v4m-8 16v4m8-4v4m-16-12h4m-4 8h4m16-8h4m-4 8h4" stroke="#b87cff" stroke-width="1.5" fill="none"/>
          <text x="62" y="23" fill="#8c95ba" font-weight="700" letter-spacing="1.5">NATIVE TARGETS</text>
          <text x="62" y="45" fill="#fff" font-size="16" font-weight="800">SM80 · SM86 · SM87</text>
        </g>
        <g transform="translate(246)">
          <path d="M8 0h235l10 10v38l-10 10H8L0 50V8Z" fill="#090f22" stroke="#825bff" stroke-opacity=".62"/>
          <rect x="16" y="13" width="32" height="32" rx="8" fill="#1b1234" stroke="#8d5cff"/>
          <path d="M26 28v-5a6 6 0 0 1 12 0v5m-15 0h18v13H23Z" fill="none" stroke="#bd91ff" stroke-width="2"/>
          <text x="62" y="23" fill="#8c95ba" font-weight="700" letter-spacing="1.45">CHECKPOINT CONTRACT</text>
          <text x="62" y="45" fill="#fff" font-size="16" font-weight="800">GPTQ / GPTQ_V2 · INT4</text>
        </g>
        <g transform="translate(515)">
          <path d="M8 0h251l10 10v38l-10 10H8L0 50V8Z" fill="#090f22" stroke="#27b8ff" stroke-opacity=".62"/>
          <rect x="16" y="13" width="32" height="32" rx="8" fill="#0d1b35" stroke="#2cbcff"/>
          <path d="M32 18l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1Z" fill="none" stroke="#62d4ff" stroke-width="1.5"/>
          <text x="62" y="23" fill="#8c95ba" font-weight="700" letter-spacing="1.45">QWEN STATUS</text>
          <text x="62" y="45" fill="#fff" font-size="16" font-weight="800">3.5 · 3.6 · 3.8-27B ✓</text>
        </g>
      </g>

      <g transform="translate(0 372)">
        <path d="M8 0h755l12 11v38l-12 11H8L0 52V8Z" fill="#06101f" stroke="#25c9ff" stroke-opacity=".55"/>
        <text x="24" y="37" fill="#4dd7ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">&gt;_  MAX_QUALITY_4BIT  //  DESC_ACT=FALSE  //  FP16 ACTIVATIONS  //  NO DUPLICATE PACKING</text>
      </g>
    </g>

    <!-- luminous pedestal -->
    <g transform="translate(1310 453)" filter="url(#glow10)">
      <ellipse rx="208" ry="34" fill="#0a0d1c" stroke="#9d50ff" stroke-width="2" opacity=".95"/>
      <ellipse rx="176" ry="24" fill="none" stroke="#2ac8ff" stroke-width="3" opacity=".84"/>
      <ellipse rx="128" ry="14" fill="#4131ff" opacity=".26"/>
      <path d="M-195 0h390" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
    </g>

    <!-- realistic gaming workstation -->
    <g filter="url(#shadow)">
      <!-- rear body -->
      <path d="M1176 70h274l55 31v316l-55 31h-274z" fill="url(#metal)" stroke="#586375" stroke-width="2"/>
      <path d="M1450 70l55 31v316l-55 31z" fill="#0b0e14" stroke="#4a5361" stroke-width="2"/>
      <path d="M1467 113h22v264h-22z" fill="url(#mesh)" stroke="#3f4959"/>
      <path d="M1192 86h242l35 20v292l-35 20h-242z" fill="url(#glass)" stroke="#8390a6" stroke-opacity=".65"/>
      <path d="M1199 94h227" stroke="#ffffff" stroke-opacity=".16" stroke-width="2"/>
      <path d="M1202 100l40-8 160 0" stroke="#54d6ff" stroke-opacity=".14" stroke-width="3"/>

      <!-- top radiator fans -->
      <g>
        <circle cx="1243" cy="125" r="27" fill="url(#fan)"/><circle cx="1306" cy="125" r="27" fill="url(#fan)"/><circle cx="1369" cy="125" r="27" fill="url(#fan)"/>
        <circle cx="1243" cy="125" r="7" fill="#05070a"/><circle cx="1306" cy="125" r="7" fill="#05070a"/><circle cx="1369" cy="125" r="7" fill="#05070a"/>
        <path d="M1214 158h185" stroke="#293445" stroke-width="5"/>
      </g>

      <!-- rear fan and AIO block -->
      <circle cx="1227" cy="199" r="35" fill="url(#fan)"/><circle cx="1227" cy="199" r="10" fill="#0a0d14"/>
      <circle cx="1315" cy="194" r="31" fill="#0a0d16" stroke="url(#neon)" stroke-width="4"/>
      <text x="1315" y="203" text-anchor="middle" fill="#e8f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">Q</text>
      <path d="M1338 177c36-28 72-28 98-4M1340 190c39-17 71-15 96 1" fill="none" stroke="#1b202d" stroke-width="6"/>

      <!-- RAM -->
      <g>
        <rect x="1360" y="170" width="8" height="64" rx="2" fill="#222837" stroke="#805cff"/><rect x="1373" y="170" width="8" height="64" rx="2" fill="#222837" stroke="#33c7ff"/><rect x="1386" y="170" width="8" height="64" rx="2" fill="#222837" stroke="#805cff"/>
      </g>

      <!-- motherboard -->
      <rect x="1268" y="238" width="166" height="145" rx="8" fill="#0b0f15" stroke="#29384d"/>
      <path d="M1282 252h76v18h-76zm93 0h44v18h-44zm-93 104h60v14h-60zm80-92h55v70h-55z" fill="#18202b"/>
      <path d="M1280 282h138M1280 345h138" stroke="#2d3d52" stroke-width="1"/>

      <!-- GPU 1 -->
      <g>
        <path d="M1238 257h219l10 10v62l-10 10h-219l-13-10v-62z" fill="#101318" stroke="#566173" stroke-width="2"/>
        <path d="M1245 265h204l7 7v49l-7 8h-204l-8-8v-49z" fill="#0a0d11" stroke="#282f3a"/>
        <path d="M1253 275h80v44h-80z" fill="#161b22"/><path d="M1339 275h104v44h-104z" fill="#11151b"/>
        <text x="1350" y="295" fill="#dce4ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">GEFORCE RTX</text>
        <rect x="1402" y="281" width="46" height="24" rx="3" fill="#1b2028" stroke="#7d8797"/>
        <text x="1425" y="298" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">3090</text>
        <path d="M1246 331h208" stroke="#2cbcff" stroke-opacity=".55" stroke-width="2"/>
      </g>

      <!-- GPU 2 -->
      <g>
        <path d="M1238 344h219l10 10v62l-10 10h-219l-13-10v-62z" fill="#101318" stroke="#566173" stroke-width="2"/>
        <path d="M1245 352h204l7 7v49l-7 8h-204l-8-8v-49z" fill="#0a0d11" stroke="#282f3a"/>
        <path d="M1253 362h80v44h-80z" fill="#161b22"/><path d="M1339 362h104v44h-104z" fill="#11151b"/>
        <text x="1350" y="382" fill="#dce4ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">GEFORCE RTX</text>
        <rect x="1402" y="368" width="46" height="24" rx="3" fill="#1b2028" stroke="#7d8797"/>
        <text x="1425" y="385" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">3090</text>
        <path d="M1246 418h208" stroke="#925cff" stroke-opacity=".55" stroke-width="2"/>
      </g>

      <!-- NVLink bridge, clearly connecting both cards -->
      <g filter="url(#glow)">
        <path d="M1260 316h36v54h-36z" fill="#0d1117" stroke="#9c65ff" stroke-width="2"/>
        <rect x="1264" y="326" width="28" height="34" rx="4" fill="#181e27" stroke="#2bc8ff" stroke-width="1.5"/>
        <text x="1278" y="340" text-anchor="middle" fill="#d9f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="6.5" font-weight="800">NVLINK</text>
        <path d="M1269 349h18" stroke="#54d7ff" stroke-width="2"/>
      </g>

      <!-- realistic power leads -->
      <path d="M1452 276c24 3 28 18 20 35M1452 362c27 4 29 18 20 34" fill="none" stroke="#171c24" stroke-width="7"/>
      <path d="M1449 276c24 3 28 18 20 35M1449 362c27 4 29 18 20 34" fill="none" stroke="#3f4a5b" stroke-width="1.3"/>

      <!-- case accents -->
      <path d="M1183 78h258" stroke="#2cc8ff" stroke-width="2" opacity=".75"/>
      <path d="M1451 83l43 24v301l-43 24" fill="none" stroke="#8e58ff" stroke-width="3" opacity=".75"/>
      <path d="M1179 439h269" stroke="url(#neon)" stroke-width="3" opacity=".85"/>
      <text x="1480" y="250" transform="rotate(90 1480 250)" fill="#aeb7c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2">DUAL RTX 3090 · NVLINK</text>
    </g>

    <!-- right support badge -->
    <g transform="translate(1486 374)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <path d="M0 0h97l10 10v87l-10 10H0l-10-10V10Z" fill="#090d1b" stroke="url(#neon)" stroke-width="1.5"/>
      <text x="48" y="26" text-anchor="middle" fill="#aab2cf" font-size="9" font-weight="700" letter-spacing="1.4">QWEN 3.8-27B</text>
      <text x="48" y="50" text-anchor="middle" fill="#fff" font-size="13" font-weight="900">EXACT</text>
      <text x="48" y="69" text-anchor="middle" fill="#e4e6ff" font-size="11" font-weight="800">ARCHITECTURE</text>
      <text x="48" y="87" text-anchor="middle" fill="#9f72ff" font-size="12" font-weight="900">SUPPORT</text>
    </g>
  </g>

  <rect x="8" y="8" width="1584" height="504" rx="30" fill="none" stroke="url(#neon)" stroke-opacity=".72" stroke-width="2"/>
</svg>
